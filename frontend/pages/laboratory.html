<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratory — Health-Aid Clinic</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .sub { font-size:12px; color:var(--text-light); }
    .lab-cell { max-width:220px; white-space:pre-wrap; word-break:break-word; }
    .new-patient-box { grid-column: span 2; display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:14px; border:1.5px dashed var(--brown-pale); border-radius:8px; background:var(--brown-cream); }
    .new-patient-box .full { grid-column: span 2; }
    @media (max-width:900px){ .new-patient-box { grid-column: span 1; grid-template-columns:1fr; } .new-patient-box .full { grid-column: span 1; } }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <div><div class="topbar-title">Laboratory</div></div>
      </div>
      <div class="topbar-right">
        <div class="topbar-date" id="topbar-date"></div>
        <button class="btn btn-primary" onclick="openAdd()">+ Add Lab Test</button>
      </div>
    </div>

    <div class="page-content">
      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="text" class="form-control" id="search-input" placeholder="Search patient, test or address...">
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Laboratory Records</span>
          <span id="record-count" style="font-size:13px;color:var(--text-light)"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Patient</th><th>Address</th><th>Test</th><th>Result</th><th>Treatment</th><th>Notes</th><th>Actions</th></tr></thead>
            <tbody id="lab-table"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Lab Test Modal -->
<div class="modal-overlay" id="lab-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Add Lab Test</span>
      <button class="modal-close" onclick="Modal.close('lab-modal')">×</button>
    </div>
    <div class="modal-body">
      <form id="lab-form" onsubmit="return false">
        <div class="form-grid">
          <div class="form-group col-span-2">
            <label class="form-label">Patient Name <span class="req">*</span></label>
            <select id="f-patient" class="form-control" onchange="patientChanged()"></select>
          </div>

          <div class="new-patient-box" id="new-patient-box" style="display:none">
            <div class="form-group full">
              <label class="form-label">Full Name <span class="req">*</span></label>
              <input type="text" id="np-name" class="form-control" placeholder="Lab-only patient (not added to Patient Records)">
            </div>
            <div class="form-group">
              <label class="form-label">Age <span class="req">*</span></label>
              <input type="number" id="np-age" class="form-control" min="0" max="150">
            </div>
            <div class="form-group">
              <label class="form-label">Sex <span class="req">*</span></label>
              <select id="np-sex" class="form-control"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select>
            </div>
          </div>

          <div class="form-group col-span-2">
            <label class="form-label">Address</label>
            <input type="text" id="f-address" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">Test / Investigation <span class="req">*</span></label>
            <select id="f-type" class="form-control" onchange="typeChanged()"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Date <span class="req">*</span></label>
            <input type="date" id="f-date" class="form-control">
          </div>
          <div class="form-group col-span-2" id="other-wrap" style="display:none">
            <label class="form-label">Specify Test <span class="req">*</span></label>
            <input type="text" id="f-other" class="form-control" placeholder="Name of the test / investigation">
          </div>
          <div class="form-group col-span-2">
            <label class="form-label">Test Result <span class="req">*</span></label>
            <input type="text" id="f-result" class="form-control" placeholder="e.g. Positive, 11.2 g/dL, 5.4 mmol/L">
          </div>
          <div class="form-group">
            <label class="form-label">Treatment</label>
            <textarea id="f-treatment" class="form-control" rows="2"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea id="f-notes" class="form-control" rows="2"></textarea>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="Modal.close('lab-modal')">Cancel</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveRecord()"> Save</button>
    </div>
  </div>
</div>

<script src="/js/sidebar.js"></script>
<script src="/js/app.js"></script>
<script>
renderSidebar('laboratory');

const TEST_TYPES = {
  'Haematology': ['Full Blood Count (FBC)', 'Haemoglobin (Hb)', 'Packed Cell Volume (PCV)', 'ESR', 'Blood Film', 'Blood Group & Rhesus', 'Hb Genotype', 'Sickling Test', 'Reticulocyte Count', 'Coagulation Profile (PT/INR)'],
  'Biochemistry': ['Fasting Blood Glucose', 'Random Blood Glucose', 'HbA1c', 'Oral Glucose Tolerance Test (OGTT)', 'Lipid Profile', 'Liver Function Test (LFT)', 'Renal Function Test (Urea/Creatinine)', 'Serum Electrolytes', 'Serum Uric Acid', 'Serum Calcium', 'Thyroid Function Test', 'Cardiac Troponin', 'Serum Amylase'],
  'Parasitology': ['Malaria Parasite (Microscopy)', 'Malaria RDT', 'Stool Microscopy', 'Stool Occult Blood', 'Urine Microscopy (Parasites)'],
  'Microbiology': ['Urine Culture & Sensitivity', 'Blood Culture', 'Wound Swab Culture', 'High Vaginal Swab (HVS)', 'Throat Swab Culture', 'Sputum AFB / GeneXpert', 'Sputum Culture', 'Gram Stain'],
  'Serology / Immunology': ['HIV Screening', 'Hepatitis B Surface Antigen (HBsAg)', 'Hepatitis C Antibody', 'VDRL / Syphilis', 'Widal Test', 'Typhoid IgM/IgG', 'H. pylori (Ag/Ab)', 'C-Reactive Protein (CRP)', 'Rheumatoid Factor', 'ASO Titre', 'COVID-19 Antigen'],
  'Urine Tests': ['Urinalysis (Dipstick)', 'Urine Pregnancy Test (UPT)', 'Urine Protein / Albumin'],
  'Hormones & Reproductive': ['Pregnancy Test (β-hCG)', 'Semen Analysis', 'PSA', 'FSH / LH', 'Testosterone', 'Prolactin', 'Progesterone'],
  'Imaging & Other': ['Ultrasound Scan', 'X-Ray', 'ECG']
};
const OTHER = '__other__', NEW_PATIENT = '__new__';
let registered = [], labOnly = [], catalogue = [];
let recordList = [];   // records currently shown in the table
let editing = null;    // { requestId, itemId } while editing an existing record

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

function flagBadge(flag) {
  if (!flag) return '';
  const cls = flag === 'Normal' ? 'badge-success' : flag.startsWith('Critical') ? 'badge-danger' : 'badge-warning';
  return `<span class="badge ${cls}">${esc(flag)}</span>`;
}

async function loadRecords() {
  try {
    const list = await API.get('/laboratory/records?search=' + encodeURIComponent($('search-input').value));
    recordList = list;
    $('record-count').textContent = `${list.length} total`;
    $('lab-table').innerHTML = !list.length
      ? '<tr><td colspan="8"><div class="empty-state"><div class="icon"><i class="fa-solid fa-flask-vial"></i></div><h3>No laboratory records found</h3></div></td></tr>'
      : list.map(r => `<tr>
        <td style="white-space:nowrap">${Fmt.date(r.date)}</td>
        <td><strong>${esc(r.patientName)}</strong>
          <div class="sub">${esc(r.patientId)} ${r.labOnly ? '<span class="badge badge-info">Lab only</span>' : ''}</div></td>
        <td class="lab-cell">${esc(r.address) || '—'}</td>
        <td>${esc(r.testType)}${r.category ? `<div class="sub">${esc(r.category)}</div>` : ''}</td>
        <td>${r.result ? `<strong>${esc(r.result)}${r.unit && !String(r.result).includes(r.unit) ? ' ' + esc(r.unit) : ''}</strong>` : '<span class="badge badge-warning">Pending</span>'} ${flagBadge(r.flag)}</td>
        <td class="lab-cell">${esc(r.treatment) || '—'}</td>
        <td class="lab-cell">${esc(r.notes) || '—'}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-sm btn-secondary" style="padding:3px 8px" onclick="openEdit('${r._id}')" title="Edit"><i class="fa-solid fa-pen"></i></button>
          <button class="btn btn-sm btn-danger" style="padding:3px 8px" onclick="deleteRecord('${r._id}')" title="Delete"><i class="fa-solid fa-trash"></i></button>
        </td>
      </tr>`).join('');
  } catch (e) { Toast.error('Failed to load laboratory records'); }
}

async function loadRefData() {
  const [p, w, t] = await Promise.all([
    API.get('/patients?limit=1000').catch(() => ({ patients: [] })),
    API.get('/laboratory/walkin-patients').catch(() => []),
    API.get('/laboratory/tests?active=true').catch(() => [])
  ]);
  registered = p.patients || []; labOnly = w; catalogue = t;
}

function fillSelects() {
  $('f-patient').innerHTML = '<option value="">Select patient</option>' +
    `<option value="${NEW_PATIENT}">+ New lab-only patient</option>` +
    (registered.length ? `<optgroup label="Registered Patients">${registered.map(p => `<option value="p:${p._id}">${esc(p.name)} (${esc(p.patientId)})</option>`).join('')}</optgroup>` : '') +
    (labOnly.length ? `<optgroup label="Lab-only Patients">${labOnly.map(w => `<option value="w:${w._id}">${esc(w.name)} (${esc(w.walkInId)})</option>`).join('')}</optgroup>` : '');

  const groups = {};
  Object.entries(TEST_TYPES).forEach(([g, l]) => groups[g] = l.slice());
  const known = new Set(Object.values(TEST_TYPES).flat().map(n => n.toLowerCase()));
  catalogue.forEach(t => {
    if (known.has(String(t.name).toLowerCase())) return;
    known.add(String(t.name).toLowerCase());
    (groups[t.category || 'Other Tests'] = groups[t.category || 'Other Tests'] || []).push(t.name);
  });
  $('f-type').innerHTML = '<option value="">Select test / investigation</option>' +
    Object.entries(groups).map(([g, l]) => `<optgroup label="${esc(g)}">${l.map(n => `<option value="${esc(n)}" data-cat="${esc(g)}">${esc(n)}</option>`).join('')}</optgroup>`).join('') +
    `<option value="${OTHER}">Other (specify)…</option>`;
}

function patientChanged() {
  const v = $('f-patient').value;
  $('new-patient-box').style.display = v === NEW_PATIENT ? '' : 'none';
  // Pre-fill the address from the chosen patient (still editable)
  let addr = '';
  if (v.startsWith('p:')) addr = registered.find(p => p._id === v.slice(2))?.address || '';
  if (v.startsWith('w:')) addr = labOnly.find(w => w._id === v.slice(2))?.address || '';
  $('f-address').value = addr;
}
function typeChanged() { $('other-wrap').style.display = $('f-type').value === OTHER ? '' : 'none'; }

async function openAdd() {
  editing = null;
  $('modal-title').textContent = 'Add Lab Test';
  $('f-patient').disabled = false;
  $('lab-form').reset();
  await loadRefData();
  fillSelects();
  $('f-date').value = new Date().toISOString().slice(0, 10);
  patientChanged(); typeChanged();
  Modal.open('lab-modal');
}

async function openEdit(id) {
  const r = recordList.find(x => x._id === id);
  if (!r) return;
  const [requestId, itemId] = id.split('_');
  editing = { requestId, itemId };
  $('lab-form').reset();
  await loadRefData();
  fillSelects();
  $('modal-title').textContent = 'Edit Lab Test';
  // The patient cannot be changed on an existing record
  $('f-patient').innerHTML = `<option value="">${esc(r.patientName)} (${esc(r.patientId)})</option>`;
  $('f-patient').disabled = true;
  $('new-patient-box').style.display = 'none';
  $('f-address').value = r.address || '';
  // Select the test type, or fall back to "Other" for custom / older entries
  const opt = [...$('f-type').options].find(o => o.value === r.testType);
  if (opt) { $('f-type').value = r.testType; $('f-other').value = ''; }
  else { $('f-type').value = OTHER; $('f-other').value = r.testType; }
  typeChanged();
  $('f-date').value = String(r.date || '').slice(0, 10) || new Date().toISOString().slice(0, 10);
  $('f-result').value = r.result || '';
  $('f-treatment').value = r.treatment || '';
  $('f-notes').value = r.notes || '';
  Modal.open('lab-modal');
}

async function deleteRecord(id) {
  const r = recordList.find(x => x._id === id);
  if (!r || !confirm(`Delete this ${r.testType} record for ${r.patientName}?`)) return;
  const [requestId, itemId] = id.split('_');
  try {
    await API.delete(`/laboratory/records/${requestId}/${itemId}`);
    Toast.success('Laboratory record deleted');
    loadRecords();
  } catch (e) { Toast.error(e.message); }
}

async function saveRecord() {
  const pv = $('f-patient').value;
  const sel = $('f-type');
  const isOther = sel.value === OTHER;
  const testType = isOther ? $('f-other').value.trim() : sel.value;
  const body = {
    testType, category: isOther ? 'Other' : (sel.selectedOptions[0]?.dataset.cat || ''),
    result: $('f-result').value.trim(), date: $('f-date').value,
    address: $('f-address').value.trim(),
    treatment: $('f-treatment').value.trim(), notes: $('f-notes').value.trim()
  };
  if (editing) {
    if (!testType) return Toast.warning(isOther ? 'Please specify the test.' : 'Please select a test.');
    if (!body.result) return Toast.warning('Please enter the test result.');
    if (!body.date) return Toast.warning('Please select the date.');
    $('save-btn').disabled = true;
    try {
      await API.put(`/laboratory/records/${editing.requestId}/${editing.itemId}`, body);
      Toast.success('Laboratory record updated');
      Modal.close('lab-modal');
      loadRecords();
    } catch (e) { Toast.error(e.message); }
    finally { $('save-btn').disabled = false; }
    return;
  }
  if (!pv) return Toast.warning('Please select a patient.');
  if (pv === NEW_PATIENT) {
    body.newPatient = { name: $('np-name').value.trim(), age: $('np-age').value, sex: $('np-sex').value, address: body.address };
    if (!body.newPatient.name) return Toast.warning('Please enter the patient name.');
    if (body.newPatient.age === '') return Toast.warning('Please enter the patient age.');
    if (!body.newPatient.sex) return Toast.warning('Please select the patient sex.');
  } else if (pv.startsWith('p:')) body.patient = pv.slice(2);
  else body.walkInPatient = pv.slice(2);
  if (!testType) return Toast.warning(isOther ? 'Please specify the test.' : 'Please select a test.');
  if (!body.result) return Toast.warning('Please enter the test result.');
  if (!body.date) return Toast.warning('Please select the date.');

  $('save-btn').disabled = true;
  try {
    await API.post('/laboratory/records', body);
    Toast.success('Lab test saved');
    Modal.close('lab-modal');
    loadRecords();
  } catch (e) { Toast.error(e.message); }
  finally { $('save-btn').disabled = false; }
}

let searchTimer;
$('search-input').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadRecords, 250); });
loadRecords();
</script>
</body>
</html>
